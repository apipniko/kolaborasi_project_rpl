<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-900 text-white">
    <div class="flex min-h-screen items-center justify-center px-4 py-10">
        <div class="w-full max-w-lg rounded-3xl border border-white/10 bg-slate-950/90 p-8 shadow-2xl shadow-slate-900/40 backdrop-blur-sm">
            <h1 class="text-4xl font-bold text-rose-400">Admin Login</h1>
            <p class="mt-2 text-slate-400">Masuk dengan akun admin untuk mengelola produk.</p>

            {% if error %}
            <div class="mt-6 rounded-2xl bg-rose-100 px-5 py-4 text-sm font-semibold text-rose-700">
                {{ error }}
            </div>
            {% endif %}

            <form action="" method="POST" class="mt-8 space-y-6">
                <div class="grid gap-4">
                    <label class="grid gap-2 text-sm font-semibold text-slate-200">
                        Username
                        <input type="text" name="username" class="rounded-2xl border border-slate-700 bg-slate-900 px-4 py-4 text-white outline-none focus:border-rose-500 focus:ring-2 focus:ring-rose-500/20" required>
                    </label>

                    <label class="grid gap-2 text-sm font-semibold text-slate-200">
                        Password
                        <input type="password" name="password" class="rounded-2xl border border-slate-700 bg-slate-900 px-4 py-4 text-white outline-none focus:border-rose-500 focus:ring-2 focus:ring-rose-500/20" required>
                    </label>
                </div>

                <button type="submit" class="w-full rounded-2xl bg-rose-500 px-6 py-4 text-xl font-bold text-white shadow-lg shadow-rose-500/20 transition hover:bg-rose-600">
                    Login Admin
                </button>
            </form>

            <p class="mt-6 text-sm text-slate-500">Halaman ini tersembunyi. Jangan bagikan tautan ini kepada pengguna biasa.</p>
        </div>
    </div>
</body>
</html>
